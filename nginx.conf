server {
    listen 80;
    server_name gentlemenbarber.ru www.gentlemenbarber.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.gentlemenbarber.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.gentlemenbarber.ru;

    ssl_certificate     /etc/letsencrypt/live/www.gentlemenbarber.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gentlemenbarber.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers  HIGH:!aNULL:!MD5;

    # CSP: фронт + Яндекс.Метрика + Google Fonts + Swagger CDN
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://mc.yandex.ru wss://mc.yandex.ru; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru https://fastapi.tiangolo.com;" always;

    # Весь API → backend как есть
    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Остальное → фронт
    location / {
        proxy_pass http://frontend:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
