upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;

    # --- Healthcheck FastAPI (он у тебя на /healthz) ---
    location /healthz {
        proxy_pass            http://backend/healthz;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
    }

    # --- API → FastAPI backend (API живёт на /api/...) ---
    location /api/ {
        proxy_pass            http://backend/api/;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # --- Swagger/docs на /api/docs ---
    # (Можно ходить прямо на /api/docs, отдельный /docs не нужен)
    # Если хочешь /docs без /api, раскомментируй блок ниже.
    #
    # location /docs {
    #     proxy_pass            http://backend/api/docs;
    #     proxy_set_header      Host              $host;
    #     proxy_set_header      X-Real-IP         $remote_addr;
    #     proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header      X-Forwarded-Proto $scheme;
    # }

    # --- Всё остальное → Next.js frontend ---
    location / {
        proxy_pass            http://frontend;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_buffering       on;
        proxy_buffer_size     128k;
        proxy_buffers         4 256k;
    }
}
