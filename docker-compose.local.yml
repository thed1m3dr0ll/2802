version: "3.9"

services:
  # === PostgreSQL (локально) ===
  postgres:
    image: postgres:16
    container_name: gentlemen_barber_db
    environment:
      POSTGRES_DB: gentlemen_barber
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gentlemen_barber"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # === FastAPI backend (локал) ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gentlemen_barber_api
    env_file:
      - ./backend/.env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # === Telegram-бот (локал, можно отключить если не нужен) ===
  telegram-bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: gentlemen_barber_telegram_bot
    env_file:
      - ./bot/.env.local
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # === Next.js frontend (локал) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gentlemen_barber_frontend
    env_file:
      - ./frontend/.env.local
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # === Nginx (локальный реверс-прокси) ===
  nginx:
    image: nginx:latest
    container_name: gentlemen_barber_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
