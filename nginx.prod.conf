upstream frontend_app {
    server gentlemen_barber_frontend:3000;
}

upstream backend_app {
    server gentlemen_barber_api:8000;
}

# === HTTP: всё уводим на HTTPS + www ===
server {
    listen 80;
    server_name gentlemenbarber.ru www.gentlemenbarber.ru;

    # ACME-челленджи для certbot не редиректим
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное с http → https://www
    location / {
        return 301 https://www.gentlemenbarber.ru$request_uri;
    }
}

# === HTTPS: голый домен → www ===
server {
    listen 443 ssl;
    server_name gentlemenbarber.ru;

    ssl_certificate     /etc/letsencrypt/live/www.gentlemenbarber.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gentlemenbarber.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://www.gentlemenbarber.ru$request_uri;
}

# === HTTPS: основной сервер www ===
server {
    listen 443 ssl;
    server_name www.gentlemenbarber.ru;

    ssl_certificate     /etc/letsencrypt/live/www.gentlemenbarber.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gentlemenbarber.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security-заголовки ---
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options     "nosniff"                              always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # --- CSP под стек ---
    add_header Content-Security-Policy "
        default-src 'self';
        connect-src 'self'
                    https://mc.yandex.ru
                    wss://mc.yandex.ru
                    https://api-maps.yandex.ru
                    https://*.yandex.ru;
        script-src  'self'
                    'unsafe-inline'
                    https://mc.yandex.ru
                    https://cdn.jsdelivr.net
                    https://api-maps.yandex.ru
                    https://*.yandex.ru;
        style-src   'self'
                    'unsafe-inline'
                    https://fonts.googleapis.com
                    https://cdn.jsdelivr.net;
        font-src    'self'
                    data:
                    https://fonts.gstatic.com;
        img-src     'self'
                    data:
                    https://mc.yandex.ru
                    https://fastapi.tiangolo.com
                    https://api-maps.yandex.ru
                    https://*.yandex.ru;
        frame-src   https://api-maps.yandex.ru
                    https://*.yandex.ru;
    " always;

    # --- Редирект старого URL /club → /about ---
    location = /club {
        return 301 https://www.gentlemenbarber.ru/about;
    }

    # --- Статика Next.js — кеш до года ---
    location /_next/static/ {
        proxy_pass         http://frontend_app;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log         off;
    }

    # --- Публичные медиа — кеш 30 дней ---
    location ~* \.(jpg|jpeg|png|webp|avif|gif|svg|ico|woff2|woff|ttf)$ {
        proxy_pass         http://frontend_app;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=2592000";
        access_log         off;
    }

    # --- Закрываем Swagger/backend-доки от внешнего мира ---
    location ~ ^/api/(docs|redoc|openapi\.json) {
        return 404;
    }

    # --- API → FastAPI backend (всё под /api) ---
    location /api/ {
        proxy_pass            http://backend_app;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto  $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # --- Healthcheck backend-а ---
    location = /healthz {
        proxy_pass            http://backend_app/healthz;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto  $scheme;
    }

    # --- Всё остальное → Next.js frontend ---
    location / {
        proxy_pass            http://frontend_app;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto  $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_buffering       on;
        proxy_buffer_size     128k;
        proxy_buffers         4 256k;
    }
}
